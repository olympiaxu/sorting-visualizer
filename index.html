<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorting Visualizer</title>
    <link rel="stylesheet" href="web/style.css">
</head>
<body>
    <header class="titlebar">
        <h1>Sorting Visualizer</h1>
    </header>

    <div class="workspace">
        <aside class="inspector">
            <section class="group">
                <h2 class="group-title">Data</h2>
                <label class="row">
                    <span class="row-label">Size</span>
                    <output id="sizeLabel">40</output>
                    <input type="range" id="sizeSlider" min="5" max="100" value="40">
                </label>
                <button id="generateButton">New Array</button>
            </section>

            <section class="group">
                <h2 class="group-title">Algorithm</h2>
                <select id="algorithmSelect">
                    <option value="bubble">Bubble Sort</option>
                    <option value="selection">Selection Sort</option>
                    <option value="compare">Compare Both</option>
                </select>
            </section>

            <section class="group">
                <h2 class="group-title">Playback</h2>
                <label class="row">
                    <span class="row-label">Speed</span>
                    <input type="range" id="speedSlider" min="1" max="100" value="60">
                </label>
                <button id="sortButton" class="primary">Run Sort</button>
            </section>
        </aside>

        <main class="panels">
            <div class="panel" id="panelA">
                <div class="panel-header">
                    <h2 class="panel-title">Bubble Sort</h2>
                    <dl class="stats">
                        <dt>Comparisons</dt><dd class="comparisons">0</dd>
                        <dt>Swaps</dt><dd class="swaps">0</dd>
                    </dl>
                </div>
                <div class="plot">
                    <div class="axis"><span>100</span><span>75</span><span>50</span><span>25</span><span>0</span></div>
                    <div class="bars"></div>
                </div>
            </div>

            <div class="panel hidden" id="panelB">
                <div class="panel-header">
                    <h2 class="panel-title">Selection Sort</h2>
                    <dl class="stats">
                        <dt>Comparisons</dt><dd class="comparisons">0</dd>
                        <dt>Swaps</dt><dd class="swaps">0</dd>
                    </dl>
                </div>
                <div class="plot">
                    <div class="axis"><span>100</span><span>75</span><span>50</span><span>25</span><span>0</span></div>
                    <div class="bars"></div>
                </div>
            </div>
        </main>
    </div>

    <footer class="statusbar">
        <div class="legend">
            <span><i class="swatch"></i> Unsorted</span>
            <span><i class="swatch comparing"></i> Comparing</span>
            <span><i class="swatch swapping"></i> Swapping</span>
            <span><i class="swatch sorted"></i> Sorted</span>
        </div>
        <div class="statusbar-right">
            <span class="status" id="status">Idle</span>
            <span class="version">v1.0.0</span>
        </div>
    </footer>

    <script src="web/script.js"></script>
</body>
</html>
